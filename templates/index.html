<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataCleanse & Applied Analytics Studio</title>
    <!-- FontAwesome Icons (Offline Local & CDN Fallback) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/css/all.min.css') }}">
    <!-- Chart.js Libraries (Offline Local & CDN Fallback) -->
    <script src="{{ url_for('static', filename='vendor/js/chart.min.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/js/chartjs-chart-matrix.min.js') }}"></script>
    <!-- Custom Modular CSS System -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}?v=11.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}?v=11.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tabs.css') }}?v=11.0">
</head>
<body class="dark-theme">
    {% include 'components/header.html' %}

    <!-- App Container Layout -->
    <main class="app-main">
        {% include 'components/wizard.html' %}

        <!-- Navigation Tabs Bar -->
        <nav class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('overview')">
                <i class="fa-solid fa-chart-pie"></i> 1. Health & Overview
            </button>
            <button class="tab-btn" onclick="switchTab('cleaning')">
                <i class="fa-solid fa-wand-magic-sparkles"></i> 2. Clean & Fix Data
            </button>
            <button class="tab-btn" onclick="switchTab('correlation')">
                <i class="fa-solid fa-diagram-project"></i> 3. Find Connections
            </button>
            <button class="tab-btn" onclick="switchTab('survival')">
                <i class="fa-solid fa-chart-line"></i> 4. Demographics & Trends
            </button>
            <button class="tab-btn" onclick="switchTab('explorer')">
                <i class="fa-solid fa-table"></i> 5. Search & Export
            </button>
        </nav>

        {% include 'tabs/tab1_overview.html' %}
        {% include 'tabs/tab2_cleaning.html' %}
        {% include 'tabs/tab3_correlation.html' %}
        {% include 'tabs/tab4_trends.html' %}
        {% include 'tabs/tab5_records.html' %}
    </main>

    <!-- Dynamic JavaScript -->
    <script src="{{ url_for('static', filename='js/app.js') }}?v=12.0"></script>
</body>
</html>
